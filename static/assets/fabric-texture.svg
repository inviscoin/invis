<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Malha de micro-circuitos para o fundo do Dashboard [14, 15] -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 200, 255, 0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)" />
  <path d="M0 200 Q100 150 200 200 T400 200" stroke="rgba(0, 255, 128, 0.03)" fill="none" stroke-width="2">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 200 Q100 150 200 200 T400 200; M0 200 Q100 250 200 200 T400 200; M0 200 Q100 150 200 200 T400 200" />
  </path>
</svg>